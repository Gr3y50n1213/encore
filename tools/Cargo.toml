# Build tools for the core track (codegen, fixtures). Not shipped in any app.
[workspace]
resolver = "3"
members = ["encore-tokens", "fixture-recorder", "recs-replay"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "MPL-2.0"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
