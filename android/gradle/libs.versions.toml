# Every library the Android app uses, at an exact version (docs/adr/android-0001-project-and-core-build.md).
# Check the licence again before adding a line, and add it to THIRD_PARTY_LICENSES.
[versions]
# Android Gradle plugin 9.5 needs Gradle 9.6 and JDK 17, builds up to API 37, and has Kotlin built in.
agp = "9.5.1"
kotlin = "2.4.21"
# NDK r28 aligns native libraries to 16 KB pages by default (AGP 9.5's default NDK).
ndk = "28.2.13676358"
composeBom = "2026.09.00"
# Material 3 Expressive: ButtonGroup, ToggleButton, wavy progress and the expressive
# motion scheme became stable APIs in the 1.5.0 line (release notes, 1.5.0-alpha15 to
# alpha22); the BOM's 1.4.0 predates that. Move to 1.5.0 once it is final.
material3 = "1.5.0-rc01"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
# The core's Kotlin bindings: JNA (Android build) and coroutines, the versions core CI tests with.
jna = "5.17.0"
coroutines = "1.11.0"
# The certificate verifier's Kotlin part must match rustls-platform-verifier-android in
# core/Cargo.lock; app/build.gradle.kts checks that.
rustlsPlatformVerifier = "0.2.0"
# Playback (plan section 18): ExoPlayer and the media session. Stable line.
media3 = "1.11.1"
# Play on a TV (ADR android-0007, approved by the owner on 27 November 2026): Google's Cast
# framework, closed, in Google Play services. 23.0.0 is the newest on Google's Maven (released
# 19 October 2026); media3-cast 1.11.1 asks for 22.3.1, and every Cast method it calls is
# still in 23.0.0 (checked against both jars), as Media3 1.12 moves to 23.0.0 itself.
playServicesCast = "23.0.0"
# Phase 9 (WP6, approved by the owner): home-screen widgets. Glance 1.2.0 is the latest
# stable line; it brings WorkManager, Room and DataStore with it (THIRD_PARTY_LICENSES.md).
glance = "1.2.0"
# Stage W1 (approved by the owner, 27 November 2026; ADR android-0008): the Wear OS app and
# its link to the phone. Each is the latest stable release on Google's Maven that day.
playServicesWearable = "20.0.1"
wearCompose = "1.7.2"
wearTiles = "1.6.2"
wearProtolayout = "1.4.2"
wearWatchface = "1.3.0"
junit = "4.13.2"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
rustls-platform-verifier = { group = "org.rustls", name = "rustls-platform-verifier", version.ref = "rustlsPlatformVerifier" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-datasource = { group = "androidx.media3", name = "media3-datasource", version.ref = "media3" }
media3-cast = { group = "androidx.media3", name = "media3-cast", version.ref = "media3" }
play-services-cast-framework = { group = "com.google.android.gms", name = "play-services-cast-framework", version.ref = "playServicesCast" }
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
wear-tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "wearTiles" }
wear-protolayout = { group = "androidx.wear.protolayout", name = "protolayout", version.ref = "wearProtolayout" }
wear-protolayout-material3 = { group = "androidx.wear.protolayout", name = "protolayout-material3", version.ref = "wearProtolayout" }
wear-complications-data-source-ktx = { group = "androidx.wear.watchface", name = "watchface-complications-data-source-ktx", version.ref = "wearWatchface" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-espresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
