# The owner's build PC has two CPUs and runs other work: keep Gradle small.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Which ABIs to build the Rust core for (comma separated). CI builds all four.
encore.abis=arm64-v8a,armeabi-v7a,x86_64,x86
# Set to a folder holding <abi>/libencore_core.so (for example CI's encore-core-android
# artifact) to use those libraries instead of building the core here. They must come
# from the same commit as core/bindings, or UniFFI refuses them at start.
encore.jniLibs=
