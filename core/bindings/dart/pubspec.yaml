name: encore_core
description: >-
  Dart bindings for the Encore core (generated by flutter_rust_bridge) and the
  design-token constants. Owned by the core track; generated code, do not edit by hand.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  # Must match the Rust crate's flutter_rust_bridge version exactly (core/Cargo.toml).
  flutter_rust_bridge: 2.13.0

dev_dependencies:
  test: ^1.25.0
