[package]
name = "encore-sources"
description = "The MediaSource trait, the normalized library model and one adapter per media server (Jellyfin first; OpenSubsonic, Plex, Emby and local files later)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
url.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
# Phase 7: the live link (src/ws.rs).
tokio = { workspace = true, features = ["net", "time", "sync", "rt", "macros"] }
tokio-tungstenite.workspace = true
tokio-rustls.workspace = true
futures-util.workspace = true
# Phase 12 stage 4: tags, covers and lyrics in music files on the device (src/local).
# Already in the workspace for audio analysis (MPL-2.0, THIRD_PARTY_LICENSES.md); only
# the format readers, no decoders.
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "flac", "isomp4", "ogg", "wav", "id3v2", "id3v1", "ape"] }

# Android only: the certificate verifier's one-time setup (docs/requests/core-0001).
[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
