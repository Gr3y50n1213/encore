# CI for the core and server track (core/, server/, tools/, design/tokens.json).
# The platform tracks own their own workflow files (apple.yml, android.yml, flutter.yml).
#
# Every target the plan ships is built here (PLAN-CORE-SERVER.md section 1: "every PR
# builds every target"):
#   linux    make check-core, then Swift, Kotlin (JVM) and Dart call the core on Linux
#   apple    iOS, iOS Simulator and macOS: build, link the Swift bindings, run on macOS
#            and in an iOS Simulator, package an XCFramework
#   android  arm64-v8a, armeabi-v7a, x86_64 and x86: build, check 16 KB alignment and
#            the exported symbols
#   windows  core and server tests, then Dart calls the core on Windows
# apple and android are skipped when a change touches only server/, because nothing
# they build comes from there. Run the workflow by hand to get the XCFramework and
# jniLibs as artifacts, or with "regenerate" ticked to get fresh bindings.
#
# Actions are pinned to commit SHAs; the comment names the release. Linux runs on
# ubuntu-24.04, the image whose Kotlin, Swift and NDK this file relies on
# (github.com/actions/runner-images, Ubuntu2404-Readme.md); ubuntu-latest is moving
# to Ubuntu 26, so move this label on purpose after checking that image.
name: core

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "!core/**/*.md"
      - "server/**"
      - "!server/**/*.md"
      - "tools/**"
      - "design/tokens.json"
      - "Makefile"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "core/**"
      - "!core/**/*.md"
      - "server/**"
      - "!server/**/*.md"
      - "tools/**"
      - "design/tokens.json"
      - "Makefile"
      - ".github/workflows/core.yml"
  workflow_dispatch:
    inputs:
      regenerate:
        description: "Regenerate every binding and the token constants and upload them as an artifact (no checks)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}-${{ github.event_name }}-${{ inputs.regenerate }}
  # A new push to a pull request replaces its running checks; runs on main each finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  FRB_VERSION: 2.13.0
  JNA_VERSION: 5.17.0
  # SHA-256 of jna-5.17.0.jar from Maven Central; its published SHA-1 is 33d12735bef894440780fce64f9758d420c7bae2.
  JNA_SHA256: b3a9408e7c51e08ef0e3bfcc08f443f6ec0f6191ba8cd7c18d53d2b22e5bdbc0
  # The Kotlin bindings' async calls are suspend functions (UniFFI uses
  # kotlinx-coroutines). Apache-2.0; published 7 May 2026; SHA-256 computed from
  # Maven Central, whose SHA-1 is 3d57dc678bd8d72a60e7adf0eca5c54e3f4f4b79.
  COROUTINES_VERSION: 1.11.0
  COROUTINES_SHA256: d1d75aa01dffbb4d1c520e67e4c4e7f5f6174718e7cb4632412503f2f0e604fa

jobs:
  regenerate:
    name: Regenerate bindings and tokens (Linux)
    if: ${{ inputs.regenerate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust (stable, with rustfmt)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      # Restore only: the linux job owns this cache and saves it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/flutter_rust_bridge_codegen
            # flutter_rust_bridge installs cargo-expand by itself when it is missing.
            ~/.cargo/bin/cargo-expand
            core/target
            server/target
            tools/target
          key: core-linux-${{ hashFiles('core/Cargo.lock', 'server/Cargo.lock', 'tools/Cargo.lock') }}-frb${{ env.FRB_VERSION }}-expand
          restore-keys: core-linux-

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: flutter_rust_bridge_codegen ${{ env.FRB_VERSION }}
        run: |
          if ! flutter_rust_bridge_codegen --version 2>/dev/null | grep -qF "$FRB_VERSION"; then
            cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked --force
          fi
          flutter_rust_bridge_codegen --version

      - name: Generate
        run: |
          (cd core/bindings/dart && dart pub get)
          make -C core tokens bindings

      - name: Upload the generated files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encore-core-generated
          path: |
            core/bindings/
            core/encore-dart/src/frb_generated.rs
            !core/bindings/dart/.dart_tool/
            !core/bindings/dart/pubspec.lock
          retention-days: 3
          if-no-files-found: error

  linux:
    name: "Linux: make check-core, then Swift, Kotlin and Dart call the core"
    if: ${{ !inputs.regenerate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      apps: ${{ steps.changes.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # apps=false only when we can prove every changed file is in server/ or is a .md
      # file; anything uncertain (a new branch, a force push, a manual run) builds all.
      - name: Which apps does this change touch
        id: changes
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="" ;;
          esac
          apps=true
          if [ -n "${base//0/}" ] && git fetch -q --depth=1 origin "$base"; then
            changed="$(git diff --name-only "$base" HEAD)"
            printf 'Changed:\n%s\n' "$changed"
            relevant="$(grep -vE '\.md$' <<<"$changed" | grep -vE '^server/' || true)"
            if [ -z "$relevant" ]; then apps=false; fi
          fi
          echo "apps=$apps" | tee -a "$GITHUB_OUTPUT"

      - name: Rust (stable, with rustfmt and clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/flutter_rust_bridge_codegen
            # flutter_rust_bridge installs cargo-expand by itself when it is missing.
            ~/.cargo/bin/cargo-expand
            core/target
            server/target
            tools/target
          key: core-linux-${{ hashFiles('core/Cargo.lock', 'server/Cargo.lock', 'tools/Cargo.lock') }}-frb${{ env.FRB_VERSION }}-expand
          restore-keys: core-linux-

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: flutter_rust_bridge_codegen ${{ env.FRB_VERSION }}
        run: |
          if ! flutter_rust_bridge_codegen --version 2>/dev/null | grep -qF "$FRB_VERSION"; then
            cargo install flutter_rust_bridge_codegen --version "$FRB_VERSION" --locked --force
          fi
          flutter_rust_bridge_codegen --version

      - name: make check-core
        run: |
          (cd core/bindings/dart && dart pub get)
          make check-core REQUIRE_DART=1

      - name: Colour schemes in tokens.json match tools/palette
        run: python3 -I -B tools/palette/palette.py check design/tokens.json

      # Section 24: fails on a dependency licence nobody has reviewed (tools/ci/licences.json).
      - name: Every dependency licence is reviewed (core, server, tools)
        run: |
          python3 -I -B tools/ci/check_licences.py --self-test
          python3 -I -B tools/ci/check_licences.py tools/ci/licences.json core server tools

      # Board 07: search answers in under search.budgetMs (50 ms); every browse page
      # (first and last, every sort) is held to the same. 50,000 songs, release
      # build; the timings are printed here. A runner is not a phone.
      - name: Search and browse budgets on 50,000 songs
        working-directory: core
        run: cargo test --locked -p encore-store --release --test search_budget -- --ignored --nocapture

      # When the check finds stale bindings, this holds what CI generated, so the
      # difference can be read without a Dart SDK.
      - name: Upload the bindings CI generated (only when the check fails)
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encore-core-bindings-on-failure
          path: |
            core/bindings/
            core/target/bindings-check/
            core/encore-dart/src/frb_generated.rs
            !core/bindings/dart/.dart_tool/
            !core/bindings/dart/pubspec.lock
          retention-days: 3
          if-no-files-found: ignore

      - name: Build the core libraries
        working-directory: core
        run: cargo build --locked -p encore-core -p encore-dart

      # The smoke steps below sign in, sync, browse, play and search over real HTTP
      # against the real Jellyfin recording, served on 127.0.0.1 by
      # tools/ci/replay_jellyfin.py (one fresh server per step). This step runs the
      # same flow in Rust with the production settings first.
      - name: The production path over HTTP (Rust, on the Jellyfin replay)
        working-directory: core
        run: |
          source ../tools/ci/replay.sh && start_replay
          cargo test --locked -p encore-core library_flow_over_http -- --ignored

      - name: Swift (Swift 6 mode)
        working-directory: core
        run: |
          swiftc --version
          swiftc -swift-version 6 -module-name SmokeSwift \
            -I bindings/swift -Xcc -fmodule-map-file=bindings/swift/EncoreCoreFFI.modulemap \
            -L target/debug -lencore_core \
            bindings/swift/EncoreCore.swift bindings/tokens/EncoreTokens.swift smoke/swift/main.swift \
            -o target/smoke-swift
          source ../tools/ci/replay.sh && start_replay
          out="$(LD_LIBRARY_PATH=target/debug target/smoke-swift)"
          echo "$out"
          grep -qF 'library flow OK' <<<"$out"

      - name: Kotlin (JVM with JNA)
        working-directory: core
        run: |
          kotlinc -version
          curl -fsSL --retry 3 -o target/jna.jar \
            "https://repo1.maven.org/maven2/net/java/dev/jna/jna/$JNA_VERSION/jna-$JNA_VERSION.jar"
          echo "$JNA_SHA256  target/jna.jar" | sha256sum -c -
          curl -fsSL --retry 3 -o target/coroutines.jar \
            "https://repo1.maven.org/maven2/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/$COROUTINES_VERSION/kotlinx-coroutines-core-jvm-$COROUTINES_VERSION.jar"
          echo "$COROUTINES_SHA256  target/coroutines.jar" | sha256sum -c -
          kotlinc -cp target/jna.jar:target/coroutines.jar -include-runtime -d target/smoke-kotlin.jar \
            bindings/kotlin/uk/gcartee/encore/core/encore_core.kt bindings/tokens/EncoreTokens.kt smoke/kotlin/Main.kt
          source ../tools/ci/replay.sh && start_replay
          out="$(java -Djna.library.path=target/debug -cp target/smoke-kotlin.jar:target/jna.jar:target/coroutines.jar MainKt)"
          echo "$out"
          grep -qF 'library flow OK' <<<"$out"

      - name: Dart
        working-directory: core/bindings/dart
        run: |
          dart --version
          dart analyze
          source ../../../tools/ci/replay.sh && start_replay
          # --run-skipped: the library-flow test fails if the replay URL is missing.
          ENCORE_DART_LIB="$GITHUB_WORKSPACE/core/target/debug/libencore_dart.so" dart test --run-skipped

  apple:
    # A real iPhone or iPad can't be reached from CI, so the iOS device slice is built
    # and linked but not run. The Apple track runs it on devices.
    name: "Apple: iOS, iOS Simulator and macOS"
    needs: linux
    if: ${{ needs.linux.outputs.apps == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: core
    env:
      # Plan section 15: iOS and iPadOS 17, macOS 14.
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      APPLE_TARGETS: aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios aarch64-apple-darwin x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust (stable, with the Apple targets) and Xcode
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add $APPLE_TARGETS
          rustc --version
          xcodebuild -version
          uname -m

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: core-apple-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: core-apple-

      # Album palettes must be the same bytes on every device (board 04, ADR
      # core-0007). Linux and Windows check the golden values on x86_64; this runs
      # the same tests on Apple silicon (arm64).
      - name: Palettes are the same bytes on Apple silicon
        run: |
          uname -m
          cargo test --locked -p encore-core palette

      - name: Build libencore_core.a for each Apple target
        env:
          # Plain text, so the line with the system libraries can be read back.
          CARGO_TERM_COLOR: never
        run: |
          # Touch the crate so rustc prints the system libraries the static library
          # needs even when the cache already holds a build.
          touch encore-core/src/lib.rs
          mkdir -p target # tee opens its log before cargo creates target/
          for t in $APPLE_TARGETS; do
            echo "::group::$t"
            cargo rustc --locked --release -p encore-core --target "$t" --crate-type staticlib \
              -- --print native-static-libs 2>&1 | tee "target/$t.build.log"
            # -a: macOS grep calls the log binary if anything coloured slips in.
            grep -a -o 'native-static-libs: .*' "target/$t.build.log" | tail -n 1 \
              | sed -e 's/^native-static-libs: //' -e $'s/\x1b\\[[0-9;]*m//g' > "target/$t.native-libs"
            echo "links: $(cat "target/$t.native-libs")"
            test -s "target/$t.native-libs"
            test -f "target/$t/release/libencore_core.a"
            echo "::endgroup::"
          done

      - name: Compile and link the Swift bindings for each Apple target (Swift 6 mode)
        run: |
          mkdir -p target/smoke
          swift_build() { # rust target, swift target, SDK
            echo "::group::$1 ($2)"
            # shellcheck disable=SC2046 # the system library flags are meant to split
            xcrun --sdk "$3" swiftc -swift-version 6 -module-name SmokeSwift -target "$2" \
              -I bindings/swift -Xcc -fmodule-map-file=bindings/swift/EncoreCoreFFI.modulemap \
              bindings/swift/EncoreCore.swift bindings/tokens/EncoreTokens.swift smoke/swift/main.swift \
              "target/$1/release/libencore_core.a" $(cat "target/$1.native-libs") \
              -o "target/smoke/$1"
            lipo -info "target/smoke/$1"
            echo "::endgroup::"
          }
          swift_build aarch64-apple-ios     arm64-apple-ios17.0            iphoneos
          swift_build aarch64-apple-ios-sim arm64-apple-ios17.0-simulator  iphonesimulator
          swift_build x86_64-apple-ios      x86_64-apple-ios17.0-simulator iphonesimulator
          swift_build aarch64-apple-darwin  arm64-apple-macos14.0          macosx
          swift_build x86_64-apple-darwin   x86_64-apple-macos14.0         macosx

      - name: Run on macOS
        run: |
          case "$(uname -m)" in
            arm64) bin=target/smoke/aarch64-apple-darwin ;;
            *)     bin=target/smoke/x86_64-apple-darwin ;;
          esac
          source ../tools/ci/replay.sh && start_replay
          out="$("$bin")"
          echo "$out"
          grep -qF 'Hello, CI, from the Encore core.' <<<"$out"
          grep -qF 'library flow OK' <<<"$out"

      - name: Run in an iOS Simulator
        run: |
          case "$(uname -m)" in
            arm64) bin="$PWD/target/smoke/aarch64-apple-ios-sim" ;;
            *)     bin="$PWD/target/smoke/x86_64-apple-ios" ;;
          esac
          # The newest installed iOS runtime, first available iPhone in it.
          udid="$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("SimRuntime\\.iOS-"))]
            | sort_by(.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)") | [(.maj | tonumber), (.min | tonumber)])
            | reverse | map(.value[] | select(.name | startswith("iPhone"))) | first | .udid // empty')"
          test -n "$udid" || { echo "no available iPhone simulator"; xcrun simctl list runtimes; exit 1; }
          xcrun simctl list devices available | grep "$udid"
          # The simulator shares the Mac's network, so 127.0.0.1 reaches the replay;
          # simctl passes SIMCTL_CHILD_* variables to the spawned program. Started
          # before the boot, which keeps the Mac busy for a while.
          source ../tools/ci/replay.sh && start_replay
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          status=0
          out="$(SIMCTL_CHILD_ENCORE_REPLAY_URL="$ENCORE_REPLAY_URL" xcrun simctl spawn "$udid" "$bin")" || status=$?
          xcrun simctl shutdown "$udid" || true
          echo "$out"
          test "$status" -eq 0
          grep -qF 'Hello, CI, from the Encore core.' <<<"$out"
          grep -qF 'library flow OK' <<<"$out"

      - name: Package an XCFramework
        run: |
          out=target/apple
          rm -rf "$out"
          mkdir -p "$out/headers" "$out/ios-simulator" "$out/macos"
          cp bindings/swift/EncoreCoreFFI.h "$out/headers/"
          cp bindings/swift/EncoreCoreFFI.modulemap "$out/headers/module.modulemap"
          lipo -create target/aarch64-apple-ios-sim/release/libencore_core.a target/x86_64-apple-ios/release/libencore_core.a \
            -output "$out/ios-simulator/libencore_core.a"
          lipo -create target/aarch64-apple-darwin/release/libencore_core.a target/x86_64-apple-darwin/release/libencore_core.a \
            -output "$out/macos/libencore_core.a"
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libencore_core.a -headers "$out/headers" \
            -library "$out/ios-simulator/libencore_core.a" -headers "$out/headers" \
            -library "$out/macos/libencore_core.a" -headers "$out/headers" \
            -output "$out/EncoreCoreFFI.xcframework"
          cp bindings/swift/EncoreCore.swift bindings/tokens/EncoreTokens.swift "$out/"
          plutil -p "$out/EncoreCoreFFI.xcframework/Info.plist"
          du -sh "$out/EncoreCoreFFI.xcframework"

      # Only on a manual run, to keep within the private repo's artifact storage.
      - name: Upload the XCFramework (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encore-core-apple
          path: |
            core/target/apple/EncoreCoreFFI.xcframework
            core/target/apple/EncoreCore.swift
            core/target/apple/EncoreTokens.swift
          retention-days: 7
          if-no-files-found: error

  android:
    # Builds and inspects the libraries; running them needs an emulator or a phone,
    # which the Android track does.
    name: "Android: four ABIs, 16 KB aligned"
    needs: linux
    if: ${{ needs.linux.outputs.apps == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    env:
      # Plan section 15: Android 9 (API 28).
      ANDROID_API: "28"
      ANDROID_TARGETS: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust (stable, with the Android targets) and the NDK
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add $ANDROID_TARGETS
          rustc --version
          # The image's default NDK (ANDROID_NDK_HOME) is r27, which does not align to
          # 16 KB by default; use the newest one it has.
          echo "NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          grep Pkg.Revision "$ANDROID_NDK_LATEST_HOME/source.properties"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: core-android-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: core-android-

      - name: Build libencore_core.so for each ABI
        run: |
          bin="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for t in $ANDROID_TARGETS; do
            echo "::group::$t"
            case "$t" in
              armv7-linux-androideabi) clang="armv7a-linux-androideabi$ANDROID_API-clang" ;;
              *)                       clang="$t$ANDROID_API-clang" ;;
            esac
            upper="$(tr 'a-z-' 'A-Z_' <<<"$t")"
            lower="${t//-/_}"
            # 16 KB pages: the NDK r28+ default, passed explicitly so an older NDK
            # cannot quietly produce 4 KB-aligned libraries
            # (developer.android.com/guide/practices/page-sizes).
            env "CARGO_TARGET_${upper}_LINKER=$bin/$clang" \
                "CC_$lower=$bin/$clang" "AR_$lower=$bin/llvm-ar" \
                "CARGO_TARGET_${upper}_RUSTFLAGS=-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384" \
              cargo rustc --locked --release -p encore-core --target "$t" --crate-type cdylib
            echo "::endgroup::"
          done

      - name: Check alignment and exported symbols, and lay out jniLibs
        run: |
          bin="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          symbols="$(grep -oE '\b(uniffi_encore_core_fn_func_[a-z_]+|ffi_encore_core_uniffi_contract_version)\b' \
            bindings/swift/EncoreCoreFFI.h | sort -u)"
          test -n "$symbols"
          # Plus the certificate-check setup the Android app calls (EncoreTls.kt).
          symbols="$symbols Java_uk_gcartee_encore_core_EncoreTls_initialize"
          for t in $ANDROID_TARGETS; do
            case "$t" in
              aarch64-linux-android)   abi=arm64-v8a ;;
              armv7-linux-androideabi) abi=armeabi-v7a ;;
              x86_64-linux-android)    abi=x86_64 ;;
              i686-linux-android)      abi=x86 ;;
            esac
            so="target/$t/release/libencore_core.so"
            # shellcheck disable=SC2086 # one argument per symbol
            python3 -I ../tools/ci/check_android_elf.py "$bin/llvm-readelf" "$bin/llvm-nm" "$so" $symbols
            mkdir -p "target/android/jniLibs/$abi"
            cp "$so" "target/android/jniLibs/$abi/"
          done
          du -sh target/android/jniLibs/*

      - name: Upload jniLibs and the Kotlin bindings (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encore-core-android
          path: |
            core/target/android/jniLibs
            core/bindings/kotlin
            core/bindings/tokens/EncoreTokens.kt
          retention-days: 7
          if-no-files-found: error

  windows:
    name: "Windows: core and server tests, then Dart calls the core"
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            server/target
          key: core-windows-${{ hashFiles('core/Cargo.lock', 'server/Cargo.lock') }}
          restore-keys: core-windows-

      - name: Test core and server
        run: |
          (cd core && cargo test --workspace --locked)
          (cd server && cargo test --locked)

      - name: The production path over HTTP (Rust, on the Jellyfin replay)
        working-directory: core
        run: |
          source ../tools/ci/replay.sh && start_replay
          cargo test --locked -p encore-core library_flow_over_http -- --ignored

      - name: Build the Dart library
        if: ${{ needs.linux.outputs.apps == 'true' }}
        working-directory: core
        run: cargo build --locked -p encore-dart

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        if: ${{ needs.linux.outputs.apps == 'true' }}
        with:
          sdk: stable

      - name: Dart
        if: ${{ needs.linux.outputs.apps == 'true' }}
        working-directory: core/bindings/dart
        run: |
          dart --version
          dart pub get
          source ../../../tools/ci/replay.sh && start_replay
          # --run-skipped: the library-flow test fails if the replay URL is missing.
          ENCORE_DART_LIB="$GITHUB_WORKSPACE/core/target/debug/encore_dart.dll" dart test --run-skipped
